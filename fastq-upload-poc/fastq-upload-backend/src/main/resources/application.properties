server.port=8081
fastq.upload.storage=/app/storage
fastq.upload.max-file-size-mb=200
fastq.upload.default-group-size-mb=70
fastq.upload.max-concurrent-uploads=4
fastq.upload.max-retry-count=3

# Configure spring multipart settings to allow large individual files
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
